name: CI

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

jobs:
  check-environment:
    name: Check environmnent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        name: Install Xtensa Rust
        with:
          default: true
          ldproxy: false
      - run: rustc --print target-list | grep xtensa
      - run: env | grep LIBCLANG_PATH
      - run: xtensa-esp32-elf-gcc --version
      - run: xtensa-esp32s2-elf-gcc --version
      - run: xtensa-esp32s3-elf-gcc --version

  check-arguments:
    name: Check `buildtarget`, `version`, `override`, `ldproxy`, `name`,and `extended-llvm` arguments
    runs-on: ubuntu-latest
    steps:
      - run: rustup update stable && rustup default stable
      - uses: actions/checkout@v4
      - uses: ./
        name: Install Xtensa Rust
        with:
          override: false
          ldproxy: true
          buildtargets: esp32,esp32c3
          version: 1.64.0.0
          extended-llvm: true
          name: xtensa
      - run: rustc +xtensa --print target-list | grep xtensa
      - run: env | grep LIBCLANG_PATH
      - run: xtensa-esp32-elf-gcc --version
      - run: ls $HOME/.cargo/bin/ldproxy | grep ldproxy
      - run: cargo +xtensa --version | grep 1.64.0
      - run: rustup default | grep stable
      - run: $CLANG_PATH --version | grep -i espressif

  check-github-token:
    name: Check `github-token` | ${{ matrix.token.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `espup` answers a bad credential with `401 Unauthorized` and fails, so
        # whether the install succeeds tells us which token was actually used.
        token:
          - name: input overrides GITHUB_TOKEN
            use-input: true
            env: invalid-token-used-on-purpose
            expected: success
          - name: GITHUB_TOKEN used when input is empty
            use-input: false
            env: invalid-token-used-on-purpose
            expected: failure
          - name: falls back to github.token
            use-input: false
            env: ""
            expected: success
    steps:
      - run: rustup update stable && rustup default stable
      - uses: actions/checkout@v4
      - uses: ./
        id: install
        name: Install Xtensa Rust
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ matrix.token.env }}
        with:
          # github.token cannot be read in the matrix, only available in steps
          github-token: ${{ matrix.token.use-input && github.token || '' }}
          buildtargets: esp32
          ldproxy: false
      - name: Check the install outcome
        run: |
          echo "outcome: ${{ steps.install.outcome }}, expected: ${{ matrix.token.expected }}"
          [[ "${{ steps.install.outcome }}" = "${{ matrix.token.expected }}" ]]
      - if: matrix.token.expected == 'success'
        run: rustc +esp --print target-list | grep xtensa

  check-host-targets:
    name: Check host | ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: rustup update stable && rustup default stable
      - uses: actions/checkout@v4
      - uses: ./
        name: Install Xtensa Rust
      - run: rustc +esp --print target-list | grep xtensa
